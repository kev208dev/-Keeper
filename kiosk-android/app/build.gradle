plugins { id 'com.android.application' }

android {
    namespace 'io.keeper.kiosk'
    compileSdk 35

    defaultConfig {
        applicationId 'io.keeper.kiosk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-demo'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'android.app.InstrumentationTestRunner'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDir '../../tts/android/app/src/main/java'
        main.assets.srcDir '../../tts/android/app/src/main/assets'
    }
    androidResources { noCompress += ['onnx'] }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] } }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    testImplementation 'junit:junit:4.13.2'
}
