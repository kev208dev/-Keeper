plugins { id 'com.android.application' }
android {
    namespace 'io.keeper.tts'
    compileSdk 35
    defaultConfig {
        applicationId 'io.keeper.tts'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-android-test'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    androidResources { noCompress += ['onnx'] }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] } }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
}
