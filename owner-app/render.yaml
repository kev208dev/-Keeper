# Render 배포 설정. Render 대시보드에서 New > Blueprint로 이 저장소를 고르면 아래대로 만들어진다.
# 점주 앱, 시뮬레이터(/simulator.html), API가 서버 하나에서 함께 열린다.
services:
  - type: web
    name: keeper
    runtime: docker
    # 영구 저장소는 유료 인스턴스에서만 쓸 수 있다. 가장 작은 유료 인스턴스다
    plan: 0.5c-512mb
    # 한국과 가장 가까운 지역
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    # SQLite DB가 여기에 저장된다. 저장소가 붙은 서비스는 한 대로만 실행된다
    disk:
      name: keeper-data
      mountPath: /data
      sizeGB: 1
